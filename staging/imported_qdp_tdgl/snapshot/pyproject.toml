[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdgl-rf"
version = "0.1.0"
description = "Config-driven 2D TDGL-RF simulation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "jsonschema>=4.0",
  "numpy>=1.26",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
tdgl-rf = "tdgl_rf.cli:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

