name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Check format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Run tests
        run: pytest
      - name: CLI and demo smoke test
        run: |
          mmm-studio validate
          mmm-studio score --profile broadband --top-n 5 --json-out score_results.json
          mmm-studio run-demo --profile broadband --top-n 5 --output-dir ci-demo
          mmm-studio sweep-run examples/sweeps/profile_comparison.yaml --output-dir ci-sweep
      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmm-studio-demo
          path: |
            ci-demo
            ci-sweep
