[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-studio"
version = "0.2.0"
description = "Metamaterial discovery and analysis workbench for typed registries, surrogate scoring, and reproducible scientific software workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MMM Studio Contributors" }]
dependencies = [
    "fastapi>=0.111",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pydantic>=2.12",
    "PyYAML>=6.0",
    "typer>=0.21",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.130",
    "httpx>=0.28",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]
rf = [
    "scikit-rf>=1.2",
]

[project.scripts]
mmm-studio = "mmm_studio.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mmm_studio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "matplotlib",
    "matplotlib.*",
    "pandas",
    "pandas.*",
    "skrf",
    "yaml",
]
ignore_missing_imports = true
