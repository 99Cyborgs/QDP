name: Change Scope Hygiene

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-change-scope:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine diff span
        id: diff-span
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
            echo "refspec=origin/${{ github.event.pull_request.base.ref }}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "refspec=HEAD..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Run change-scope checker
        run: python scripts/check_change_scope.py --ref "${{ steps.diff-span.outputs.refspec }}"
