# Conservative phase-1 numerical gates for the committed longer-horizon deterministic validation tranche.
# These are bounded regression checks, not claims of asymptotic convergence
# or broader scientific validity.
surface:
  surface_id: phase1_longer_horizon
  display_name: Deterministic Phase-1 Longer-Horizon
  claim_scope: Committed longer-horizon deterministic strip and simple masked-strip follow-on tranche with conservative numerical gates, frozen references, and same-stack reproducibility on the committed n_steps=8 matrix surface only. As of 2026-04-13 it remains flagged under the copied refinement drift limits and does not widen the accepted short-horizon baseline.
  reproduction_command: tdgl-rf validate-phase1 matrices/phase1_validation_matrix_v2_long_horizon.csv validation/thresholds_long_horizon.yaml validation/reference_manifest_long_horizon.yaml configs/phase1_refinement_sanity_long_horizon.yaml
  accepted_use: Use this tranche only as an informative longer-horizon follow-on run through n_steps=8 for debugging, threshold design, and future gate decisions while refinement remains flagged; do not cite it as accepted deterministic baseline evidence.
  not_established:
    - Asymptotic convergence certification.
    - PETSc parity or broader cross-stack reproducibility.
    - Stochastic robustness or ensemble behavior.
    - Seeded-vortex support or broader geometry support beyond the committed phase-1 surface.
    - Very-long-time stability beyond the committed n_steps=8 matrix.
    - Broader physics-validation or external-benchmark claims.

campaign:
  required_campaign_status: success
  required_case_status: success
  max_charge_residual_inf: 0.45
  max_vortex_count: 0

refinement:
  delta_mean_abs2_max: 5.0e-4
  delta_charge_residual_inf_max: 0.25
  delta_delta_f_over_f0_max: 2.0e-4
  delta_qinv_max: 5.0e-3

reproducibility:
  config_path: configs/validation/reference_rf_strip_long_horizon.yaml
  summary_metric_tolerances:
    final_charge_residual_inf: 0.0
    final_mean_abs2: 0.0
    final_time: 0.0
    max_vortex_count: 0.0
  final_observable_tolerances:
    charge_residual_inf: 0.0
    delta_f_over_f0: 0.0
    mean_abs2: 0.0
    qinv: 0.0
    vortex_count: 0.0
  require_payload_hash_match: true
