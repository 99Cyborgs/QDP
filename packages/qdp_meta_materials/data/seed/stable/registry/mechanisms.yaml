- mechanism_id: MECH-QP-001
  name: Gap-contrast meta-trap network
  mechanism_class: quasiparticle_trapping
  priority_tier: C
  status: confound_heavy
  physical_principle: A periodic network of lower-gap or normal-metal regions drains nonequilibrium quasiparticles away from active junction regions.
  target_decoherence_channels:
    primary:
    - quasiparticle density
    - T1 relaxation
    secondary:
    - spectral diffusion via charge-parity events
  predicted_observable_ids:
  - OBS-QP-PARITY
  - OBS-QP-RECOV
  - OBS-T1-MEAN
  predicted_observable_signatures:
  - Parity switching and injected-recovery metrics improve together.
  - Effect can be strong but is difficult to distinguish from ordinary trap design without geometry-specific scaling.
  - No narrow band-edge witness is required.
  expected_scaling_laws:
    frequency: Not a resonant mechanism; broadband nonequilibrium-particle management.
    geometry: Trap pitch, island size, gap contrast, and diffusion pathway dominate.
    temperature: Effect collapses as thermal quasiparticles dominate.
    magnetic_field: Possible secondary interplay through vortex-assisted trapping.
    drive_amplitude: Large drive heating should reduce apparent benefit.
  device_compatibility:
    transmon: native
    fluxonium: compatible
    planar_resonator: witness_native
    3d_cavity: adapted_or_indirect
    kinetic_inductance_detector: adaptable
  fabrication_feasibility:
    standard_academic_cleanroom: true
    dilution_refrigerator_compatible: true
    millikelvin_compatible: true
    exotic_fabrication_flag: false
    gating_notes: Allowed only as secondary/support branch because null risk is high.
  experimental_protocol_ids:
  - EXP-QP-PARITY-01
  - EXP-QP-INJECT-01
  - EXP-TEMP-SCAN-01
  - EXP-REPL-01
  validation_rule_ids:
  - VAL-001
  - VAL-003
  - VAL-007
  - VAL-009
  - VAL-012
  - VAL-015
  baseline_null_priority:
  - NULL-QP-TRAP
  - NULL-THERMAL
  related_structure_ids:
  - STR-QP-GAP-LATTICE
  rejection_criteria:
  - Reject unless geometry scaling shows behavior beyond ordinary trap-area scaling.
  - Reject if benefits are reproduced by non-periodic trap placement with the same material area.
  - Reject if parity proxy does not improve.
  literature_basis:
  - Pan et al., Nat. Commun. 2022, 10.1038/s41467-022-34727-2
