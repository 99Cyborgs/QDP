- mechanism_id: MECH-EM-003
  name: Common-mode / slotline suppression by periodic ground engineering
  mechanism_class: control_mode_suppression
  priority_tier: B
  status: active
  physical_principle: Periodic ground interruptions, bridges, or inductive fences suppress slotline/common-mode propagation that can drive dephasing or unintended loss.
  target_decoherence_channels:
    primary:
    - T2 dephasing
    secondary:
    - T1 relaxation
    - control electronics noise
  predicted_observable_ids:
  - OBS-T2STAR
  - OBS-T2ECHO
  - OBS-CTRL-PSD
  - OBS-PKG-S21
  predicted_observable_signatures:
  - Improved T2* and echo with reduced de-embedded control-line/common-mode noise.
  - Effect is broadband over control bands and does not require narrow band-edge alignment.
  - Package-mode closure alone cannot reproduce the dephasing reduction.
  expected_scaling_laws:
    frequency: Broadband across control and readout spur bands.
    geometry: Depends on bridge spacing, fence inductance, and ground-gap pitch.
    temperature: Weak direct dependence.
    magnetic_field: Possible secondary sensitivity if added bridges trap flux.
    drive_amplitude: Improvement should persist at matched source power unless saturation null is active.
