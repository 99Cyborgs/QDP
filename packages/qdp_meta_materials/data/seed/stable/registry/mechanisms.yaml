- mechanism_id: MECH-PH-002
  name: Phonon escape routing and down-conversion
  mechanism_class: phonon_transport
  priority_tier: A
  status: active
  physical_principle: Structured acoustic pathways route pair-breaking phonons away from the active region or down-convert them before re-breaking Cooper pairs, reducing local quasiparticle burden.
  target_decoherence_channels:
    primary:
    - quasiparticle density
    - T1 relaxation
    secondary:
    - phonon escape pathways
  predicted_observable_ids:
  - OBS-QP-RECOV
  - OBS-QP-PARITY
  - OBS-T1-MEAN
  - OBS-TEMP-SLOPE
  predicted_observable_signatures:
  - Faster recovery after controlled quasiparticle or phonon injection.
  - Lower steady-state parity-switching rate at fixed shielding and temperature.
  - Improvement correlates with phonon routing geometry, not only with added normal metal.
  expected_scaling_laws:
    frequency: Acoustic routing effect tied to pair-breaking phonon energies and broad phonon transport spectrum rather than single microwave resonance.
    geometry: Recovery time scales with sink distance, taper angle, impedance gradient, and escape area.
    temperature: Effect weakens when thermal quasiparticles dominate over injected nonequilibrium population.
    magnetic_field: Weak direct scaling except through vortex-assisted recombination or heating.
    drive_amplitude: Large drive-induced heating should expose thermal null if present.
  device_compatibility:
    transmon: native
    fluxonium: compatible
    planar_resonator: witness_native
    3d_cavity: adapted_or_indirect
    kinetic_inductance_detector: adaptable
  fabrication_feasibility:
    standard_academic_cleanroom: true
    dilution_refrigerator_compatible: true
    millikelvin_compatible: true
    exotic_fabrication_flag: false
    gating_notes: Graded acoustic sinks are standard-lab feasible if membrane release is avoided or controlled.
  experimental_protocol_ids:
  - EXP-QP-INJECT-01
  - EXP-QP-PARITY-01
  - EXP-TEMP-SCAN-01
  - EXP-GEO-SERIES-01
  - EXP-REPL-01
  validation_rule_ids:
  - VAL-001
  - VAL-002
  - VAL-003
  - VAL-007
  - VAL-008
  - VAL-009
  - VAL-012
  - VAL-015
  baseline_null_priority:
  - NULL-QP-TRAP
  - NULL-THERMAL
  - NULL-FAB-VAR
  related_structure_ids:
  - STR-PH-GRADED-SINK
  - STR-HYB-BILAYER-INTERPOSER
  rejection_criteria:
  - Reject if recovery improvements are fully explained by ordinary gap-engineered traps or added normal-metal area.
  - Reject if parity switching does not co-move with recovery improvement.
  - Reject if injected energy calibration differs across variants.
  literature_basis:
