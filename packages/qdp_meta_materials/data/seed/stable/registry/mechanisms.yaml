- mechanism_id: MECH-VX-001
  name: Vortex-pinning lattice and parked-vortex control
  mechanism_class: magnetic_vortex_control
  priority_tier: A
  status: active
  physical_principle: Periodic antidots or engineered pinning sites set vortex entry and mobility, separating vortex-related loss from claimed metamaterial effects.
  target_decoherence_channels:
    primary:
    - vortex mobility
    - T1 relaxation
    - witness resonator loss
    secondary:
    - quasiparticle density
  predicted_observable_ids:
  - OBS-VORTEX-SLOPE
  - OBS-T1-MEAN
  - OBS-WITNESS-QI
  - OBS-QP-PARITY
  predicted_observable_signatures:
  - Loss versus field-cool becomes flatter or more reproducible when pinning lattice is present.
  - Effect depends strongly on field history and antidot geometry.
  - If dominant, coherence changes track magnetic field more strongly than band-edge placement.
  expected_scaling_laws:
    frequency: Mostly broadband microwave-loss effect rather than narrowband spectral feature.
    geometry: Strong dependence on antidot pitch, radius, and placement relative to current crowding regions.
    temperature: Vortex mobility increases with temperature; field-cooled loss slope typically rises.
    magnetic_field: Primary discriminant; strong hysteresis or slope indicates vortex mechanism.
    drive_amplitude: Weak except in nonlinear vortex motion regimes.
  device_compatibility:
    transmon: native
    fluxonium: compatible
    planar_resonator: witness_native
    3d_cavity: adapted_or_indirect
    kinetic_inductance_detector: adaptable
  fabrication_feasibility:
    standard_academic_cleanroom: true
    dilution_refrigerator_compatible: true
    millikelvin_compatible: true
    exotic_fabrication_flag: false
    gating_notes: Mandatory null-closure pathway for perforated or periodic superconducting films.
  experimental_protocol_ids:
  - EXP-BFIELD-VORTEX-01
  - EXP-QP-PARITY-01
  - EXP-GEO-SERIES-01
  - EXP-REPL-01
  validation_rule_ids:
  - VAL-001
  - VAL-003
  - VAL-006
  - VAL-007
  - VAL-009
  - VAL-010
  - VAL-015
  baseline_null_priority:
  - NULL-VORTEX
  - NULL-SHIELDING
  - NULL-FAB-VAR
  related_structure_ids:
