mechanisms:
- mechanism_id: MECH-EM-001
  name: Photonic-bandgap / electromagnetic-LDOS suppression
  mechanism_class: electromagnetic_environment
  priority_tier: A
  status: active
  physical_principle: Periodic microwave structures suppress local electromagnetic density of states and radiative decay channels near the device frequency.
  target_decoherence_channels:
    primary:
    - T1 relaxation
    secondary:
    - spectral diffusion via reduced parasitic mode density
  predicted_observable_ids:
  - OBS-T1-MEAN
  - OBS-BG-SHIFT
  - OBS-PKG-S21
  predicted_observable_signatures:
  - T1 enhancement centered near engineered stopband or band edge.
  - Witness spectroscopy resolves stopband / band-edge marker at cryogenic temperature.
  - Package transfer function remains insufficient to explain the full T1 gain.
  expected_scaling_laws:
    frequency: Maximal effect when qubit or resonator frequency sits inside or just below target bandgap.
    geometry: Effect increases with number of cells and impedance contrast until saturation.
    temperature: Weak direct temperature dependence after packaging is fixed.
    magnetic_field: No primary scaling except through superconducting film degradation.
    drive_amplitude: Weak amplitude dependence; strong amplitude dependence suggests TLS or control null.
  device_compatibility:
    transmon: native
    fluxonium: compatible
    planar_resonator: witness_native
    3d_cavity: adapted_or_indirect
    kinetic_inductance_detector: adaptable
