  - VAL-004
  - VAL-007
  - VAL-009
  - VAL-011
  - VAL-015
  baseline_null_priority:
  - NULL-EM-PURCELL
  - NULL-PKG-MODE
  - NULL-FAB-VAR
  related_structure_ids:
  - STR-EM-CPW-EBG-RING
  - STR-EM-LID-HIS
  - STR-EM-HKI-FENCE
  rejection_criteria:
  - Reject if package-mode or Purcell-null model explains the T1 shift using measured S-parameters alone.
  - Reject if stopband witness is absent at cryogenic temperature.
  - Reject if geometry scaling fails.
  literature_basis:
  - Mirhosseini et al., Nat. Commun. 2018, 10.1038/s41467-018-06142-z
  - Review evidence for superconducting quantum metamaterials with lifetime enhancement and band-edge effects
- mechanism_id: MECH-PH-001
  name: Phononic-bandgap engineering of TLS relaxation
  mechanism_class: phononic_environment
  priority_tier: A
  status: active
  physical_principle: A local phononic crystal suppresses or reshapes phonon density of states that couple to TLSs and junction-region excitations, altering relaxation memory and spectral diffusion.
  target_decoherence_channels:
    primary:
    - T1 relaxation
    - spectral diffusion
    secondary:
    - T2 dephasing
    - non-Markovian bath signatures
  predicted_observable_ids:
  - OBS-T1-NMARK
  - OBS-T1-MEAN
  - OBS-SDIFF-PSD
  - OBS-BG-SHIFT
  - OBS-TEMP-SLOPE
  predicted_observable_signatures:
  - Biexponential or memory-kernel relaxation appears near the phononic stopband.
  - Spectral-diffusion PSD changes together with T1/T2 rather than independently.
  - Witness or simulation alignment shows phononic gap near target mode frequency.
  expected_scaling_laws:
    frequency: Strongest when defect or device-relevant phonon frequency overlaps the engineered gap.
    geometry: Gap center and width scale with lattice constant, neck width, membrane thickness, and cell count.
    temperature: TLS-related temperature scaling is modified; nontrivial crossover expected as thermal phonon population rises.
    magnetic_field: No direct field scaling expected.
    drive_amplitude: Strong power dependence would indicate TLS saturation rather than bath engineering.
  device_compatibility:
    transmon: native
    fluxonium: compatible
    planar_resonator: witness_native
    3d_cavity: adapted_or_indirect
    kinetic_inductance_detector: adaptable
  fabrication_feasibility:
    standard_academic_cleanroom: true
    dilution_refrigerator_compatible: true
    millikelvin_compatible: true
    exotic_fabrication_flag: false
    gating_notes: SOI membrane release increases process risk but remains within advanced academic cleanroom capability.
  experimental_protocol_ids:
  - EXP-HOLEBURN-THERM-01
  - EXP-T1-FSWEEP-01
  - EXP-RAMSEY-PSD-01
  - EXP-TEMP-SCAN-01
  - EXP-GEO-SERIES-01
  - EXP-REPL-01
  validation_rule_ids:
  - VAL-001
  - VAL-003
  - VAL-004
  - VAL-005
  - VAL-007
  - VAL-008
  - VAL-009
  - VAL-013
  - VAL-015
  baseline_null_priority:
