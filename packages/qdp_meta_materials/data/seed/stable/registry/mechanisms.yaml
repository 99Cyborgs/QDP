  - NULL-FAB-VAR
  - NULL-CTRL-DISTORT
  related_structure_ids:
  - STR-PH-SOI-JJ-PHC
  - STR-PH-SOI-FULLCAP-PHC
  rejection_criteria:
  - Reject if memory-kernel evidence is absent and single-exponential decay fits remain sufficient.
  - Reject if temperature dependence matches standard TLS saturation / thermal-gradient nulls more closely.
  - Reject if as-built lattice dimensions move the bandgap away from the target range.
  literature_basis:
  - Chen et al., Sci. Adv. 2024, 10.1126/sciadv.ado6240
  - Odeh et al., Nat. Phys. 2025, 10.1038/s41567-024-02740-5
