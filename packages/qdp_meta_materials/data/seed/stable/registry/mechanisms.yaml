- mechanism_id: MECH-PH-003
  name: Surface-acoustic-wave / piezoelectric bandstop engineering
  mechanism_class: phononic_piezoelectric_interface
  priority_tier: B
  status: screening
  physical_principle: A piezoelectric or acoustic metamaterial stopband reduces SAW or interface-piezoelectric coupling that can feed loss and dephasing on susceptible substrates.
  target_decoherence_channels:
    primary:
    - phonon escape pathways
    - T1 relaxation
    - T2 dephasing
    secondary:
    - spectral diffusion
  predicted_observable_ids:
  - OBS-SAW-S21
  - OBS-T1-MEAN
  - OBS-T2STAR
  - OBS-BG-SHIFT
  predicted_observable_signatures:
  - Direct witness stopband appears in SAW transmission.
  - Coherence changes are strongest on substrates or interfaces with measurable piezoelectric pathway activity.
  - Effect follows acoustic not microwave band placement.
  expected_scaling_laws:
    frequency: Acoustic stopband must overlap susceptible SAW/interface mode frequencies.
    geometry: Scales with Bragg period, finger width, piezoelectric thickness, and aperture.
    temperature: May change with piezoelectric response and phonon occupation.
    magnetic_field: No direct dependence expected.
    drive_amplitude: Weak unless acoustic drive is intentionally increased.
