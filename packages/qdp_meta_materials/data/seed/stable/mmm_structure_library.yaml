artifact:
  program_id: QDP_MMM
  program_name: Meta Material Module
  module_acronym: MMM
  version: 1.0.0
  generated_on: '2026-03-14'
  governance_rules:
  - 'Baseline mechanisms are evaluated first: vortex loss, quasiparticle poisoning, two-level systems, phonon coupling, control electronics noise.'
  - Every metamaterial mechanism must reference at least one predicted observable, one experimental protocol, and one validation rule.
  - Mechanisms lacking a falsification pathway are rejected.
  - All structures must be dilution-refrigerator compatible, millikelvin compatible, and compatible with academic cleanroom fabrication unless explicitly flagged exotic.
  - Negative results are valid outputs and must be archived.
  artifact_id: MMM_STRUCTURE_LIBRARY
lab_feasibility_requirement:
  dilution_refrigerator_operation: true
  millikelvin_operation: true
  standard_nanofabrication_processes: true
  academic_cleanroom_facilities: true
  exotic_structures_flagged: true
structures:
- structure_id: STR-EM-CPW-EBG-RING
  name: CPW electromagnetic bandgap ring
  structure_family: planar_photonic_crystal
  implements_mechanisms:
  - MECH-EM-001
  geometry:
    topology: Concentric or surround ring of periodic CPW unit cells around the qubit island and readout neck
    parameters:
      lattice_constant_um:
      - 180
      - 520
      cell_count:
      - 6
      - 32
      line_width_um:
      - 8
      - 24
      gap_width_um:
      - 6
      - 18
      impedance_contrast:
      - 1.5
      - 4.0
      target_stopband_GHz:
      - 4.0
      - 8.5
  material_composition:
  - superconducting Al or NbTiN trace
  - high-resistivity Si or sapphire substrate
  operating_frequency_range:
    microwave_GHz:
    - 4.0
    - 8.5
    phononic_GHz: null
  fabrication_requirements:
    process_flow:
    - superconducting film deposition
    - optical_or_e-beam patterning
    - dry etch or lift-off
    cleanroom_level: standard
    exotic_flag: false
  integration_interface:
    placement: top metal layer around qubit / resonator perimeter
    electrical_interface: galvanically isolated or weakly coupled boundary structure
    packaging_interface: planar chip within standard sample box
  device_compatibility: &id001
    transmon: native
    fluxonium: native_or_variant
    planar_resonator: native
    3d_cavity: not_primary
    kinetic_inductance_detector: variant
  notes: Primary EM stopband candidate for planar devices.
